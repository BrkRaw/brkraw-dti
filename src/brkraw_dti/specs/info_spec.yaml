TE (ms):
  sources:
    - file: method
      key: PVM_EchoTime

TR (ms):
  sources:
    - file: method
      key: PVM_RepetitionTime

Shape:
  sources:
    - file: method
      key: PVM_Matrix

FOV (mm):
  sources:
    - file: method
      key: PVM_Fov